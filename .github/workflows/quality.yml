name: Aurum Quality
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql
      - name: PHP lint
        run: find backend public_html tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Engine tests
        run: php tests/engine.php
      - name: PHP API smoke tests
        run: bash tests/api-smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Static export
        working-directory: frontend
        env:
          AURUM_BASE_PATH: /aurum
        run: npm run build
      - name: Package
        run: bash deployment/package.sh
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        env:
          APP_ENV: test
          STORAGE_DRIVER: json
          AURUM_ADMIN_EMAILS: admin@example.test
          AURUM_PRIVATE_PATH: ${{ github.workspace }}/dist/aurum-private
          E2E_BASE_URL: http://127.0.0.1:8080/aurum/
        run: |
          set -euo pipefail
          mkdir -p /tmp/aurum-e2e/aurum
          cp -R dist/aurum/public_html/. /tmp/aurum-e2e/aurum/
          php -S 127.0.0.1:8080 -t /tmp/aurum-e2e >/tmp/aurum-php.log 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS "$E2E_BASE_URL" >/dev/null; then break; fi
            sleep .25
          done
          cd frontend
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: aurum-cloudways
          path: |
            dist/aurum-cloudways.zip
            dist/aurum-cloudways.zip.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aurum-cloudways
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" aurum-cloudways.zip aurum-cloudways.zip.sha256 --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
